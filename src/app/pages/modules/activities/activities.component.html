<app-breadcrumbs [title]="title | translate" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="content mb-3">
    <app-data-header
        [title]="title"
        [newShow]="true"
        [exportShow]="true" 
        (createEmitter)="openModal( undefined,'','md')"
    ></app-data-header>
    
    <div class="card rounded-3">
      <div class="card-header P-2">
          <div class="row g-2">

          <div class="col-4">
            <div class="search-box">
              <i class="ri-search-line search-icon"></i>
              <input type="text" class="form-control search-input" 
              [(ngModel)]="searchTerm" 
              (input)="performSearch()" 
              placeholder="Buscar...">
              <i class="ri-close-line search-close" 
              *ngIf="searchTerm" (click)="searchTerm = ''; 
              performSearch()"  
              style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;"></i>
            </div>
          </div>
          
    
      <div class="col-2">
          <div class="search-box" style="position: relative;">
              <i class="ri-calendar-2-line" 
                style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888;"></i>
              <input type="text" 
                    class="form-control search-input" 
                    style="padding-left: 30px;" 
                    mwlFlatpickr 
                    [(ngModel)]="fechaInicioRango"
                    [convertModelValue]="true"
                    [altInput]="true"
                    mode="range"
                    [altFormat]="'d/m/Y'" 
                    dateFormat="Y-m-d"
                    [locale]="Spanish"
                    (ngModelChange)="applyFilters()"
                    placeholder="Rango Fecha Inicio"
              />
              <i class="ri-close-line search-close" 
                [style.visibility]="fechaInicioRango ? 'visible' : 'hidden'" 
                (click)="clearFechaInicioRango()"
                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
              </i>
          </div>
      </div>

      <div class="col-2">
          <div class="search-box" style="position: relative;">
              <i class="ri-calendar-2-line" 
                style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888;"></i>
              <input type="text" 
                    class="form-control search-input" 
                    style="padding-left: 30px;" 
                    mwlFlatpickr 
                    [(ngModel)]="fechaFinRango"
                    [convertModelValue]="true"
                    [altInput]="true"
                    mode="range"
                    [altFormat]="'d/m/Y'" 
                    dateFormat="Y-m-d"
                    [locale]="Spanish"
                    (ngModelChange)="applyFilters()"
                    placeholder="Rango Fecha Fin"         
              />
              <i class="ri-close-line search-close" 
                [style.visibility]="fechaFinRango ? 'visible' : 'hidden'" 
                (click)="clearFechaFinRango()"
                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
              </i>
          </div>
      </div>

   
            <div class="col-auto ms-auto d-flex justify-content-end align-items-center gap-2">
              <button class="btn btn-soft-secondary btn-sm d-flex align-items-center gap-1"
              (click)="toggleViewMode()">
                <i class="ri-grid-fill align-bottom" *ngIf="viewMode === 'table'"></i>
                <i class="ri-list-check align-bottom" *ngIf="viewMode === 'cards'"></i>
                {{ viewMode === 'cards' ? 'Tabla' : 'Tarjetas' }}
              </button>

              <div class="dropdown" ngbDropdown>
                <button class="btn btn-soft-info btn-sm dropdown-toggle" type="button" id="dropdownMenuButton1" ngbDropdownToggle>
                  <i class="ri-settings-4-line"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
                  @for (column of itemsList; track column) {
                  <li class="dropdown-item p-1">
                    <div class="form-check form-check-outline form-check-primary">
                      <input class="form-check-input" type="checkbox" [id]="'formCheck' + column.prop" [(ngModel)]="column.visible">
                      <label class="form-check-label" [for]="'formCheck' + column.prop">
                        {{column.name}}
                      </label>
                    </div>
                  </li>
                  }
                </ul>
              </div>
            </div>
     
        </div>
      </div>


      <div class="card-body">
        <app-data-table
          [loading]="loading"
          [itemsList]="itemsList"
          [allcontent]="activitiesList"
          [actions]="{
            show: true,
            edit: true,
            delete: true
          }"
          (showItemEmitter)="openModal($event,'show','md')"
          (editItemEmitter)="openModal($event,'edit','md')"
          (deleteItemEmitter)="openModal($event,'delete','md')"
          [multiCheck]="true"
          (selectedItemEmitter)="getSelectedItems($event)"
          [viewMode]="viewMode">
        </app-data-table>
      </div>
    </div>
</div>
